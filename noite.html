<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noite · Bahrem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/bahrem.css">
<style>
.dash { max-width: 900px; margin: 0 auto; padding: 18px 20px 48px; }
.painel { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 20px; }
.metrica {
  border: 1px solid var(--risco); border-radius: var(--r); background: rgba(28,21,18,.75);
  padding: 16px 16px 14px; backdrop-filter: blur(4px);
}
.metrica .rotulo { font-size: 11px; color: var(--papel-2); letter-spacing: .04em; margin: 0 0 6px; }
.metrica .valor { font-family: var(--mono); font-size: 22px; color: var(--chopp); font-weight: 500; margin: 0; }
.metrica .sub { font-family: var(--mono); font-size: 11px; color: var(--papel-2); margin: 4px 0 0; }
.metrica.em-aberto .valor { color: var(--latao); }
.metrica.chamando .valor { color: var(--brasa); }

.secao { margin: 22px 0 0; }
.secao h2 { font-size: 13px; color: var(--papel-2); letter-spacing: .04em; margin: 0 0 12px; }

/* gráfico de barras em texto — cada hora é uma coluna */
.grafico {
  border: 1px solid var(--risco); border-radius: var(--r); background: rgba(28,21,18,.6);
  padding: 18px 16px 14px; display: flex; gap: 6px; align-items: flex-end;
  min-height: 120px; overflow-x: auto; scrollbar-width: none;
}
.grafico::-webkit-scrollbar { display: none; }
.colGraf { display: flex; flex-direction: column; align-items: center; gap: 5px;
  min-width: 34px; flex: 1; }
.colGraf .barra { width: 20px; background: var(--latao); border-radius: 2px 2px 0 0;
  min-height: 2px; transition: height .4s ease; }
.colGraf .hora { font-family: var(--mono); font-size: 10px; color: var(--papel-2); }
.colGraf .val { font-family: var(--mono); font-size: 9px; color: #8a7a68;
  writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; }
.colGraf.pico .barra { background: var(--chopp); }

/* top itens */
.rank { display: grid; gap: 6px; }
.rank-item {
  display: grid; grid-template-columns: 2em 1fr auto auto;
  gap: 8px; align-items: center;
  border: 1px solid var(--risco); border-radius: var(--r); padding: 9px 12px;
  background: rgba(28,21,18,.55);
}
.rank-item .pos { font-family: var(--mono); font-size: 13px; color: var(--papel-2); }
.rank-item .nome { font-size: 14px; }
.rank-item .qtd { font-family: var(--mono); font-size: 13px; color: var(--papel-2); }
.rank-item .total { font-family: var(--mono); font-size: 13px; color: var(--chopp); }
.rank-item:nth-child(1) { border-color: #c08a2e; }
.rank-item:nth-child(2), .rank-item:nth-child(3) { border-color: #4a3a2a; }

.atualizacao { font-family: var(--mono); font-size: 11px; color: #6b5c48;
  margin-top: 18px; text-align: right; }

.vazio-noite { text-align: center; padding: 40px 20px; color: var(--papel-2);
  font-family: var(--mono); font-size: 13px; }

.atualizar-btn { float: right; }
</style>
</head>
<body>

<header class="topo">
  <img class="selo" src="/marca.png" alt="Bahrem">
  <div class="marca">Noite</div>
  <div class="vaga"></div>
  <button class="btn miudo atualizar-btn" id="atualizar">atualizar</button>
  <a class="btn miudo" href="/salao">voltar ao salão</a>
</header>

<nav class="abas">
  <a href="/salao">Salão</a>
  <a href="/passe">Passe</a>
  <a href="/noite" class="aqui">Noite</a>
</nav>

<main class="dash" id="dash">
  <p class="vazio-noite">carregando…</p>
</main>

<script src="/app.js"></script>
<script>
(function () {
  const { $, esc, real, api } = B;

  function h(n) { return n < 10 ? `0${n}:00` : `${n}:00`; }

  async function carregar() {
    $('#dash').innerHTML = '<p class="vazio-noite">carregando…</p>';
    try {
      const d = await api('/api/noite');
      desenhar(d);
    } catch (e) {
      $('#dash').innerHTML = `<p class="vazio-noite">${esc(e.message)}</p>`;
    }
  }

  function desenhar(d) {
    const real2 = c => real(c).replace('R$\u00a0', 'R$ ');
    const semVendas = !d.subtotal_cent;

    /* ─── métricas no topo ─── */
    const metricas = [
      { rotulo: 'total faturado', valor: real2(d.total_cent), sub: `${real2(d.subtotal_cent)} + serviço ${real2(d.servico_cent)}`, classe: '' },
      { rotulo: 'ticket médio', valor: real2(d.ticket_cent), sub: `${d.comandas} comanda${d.comandas !== 1 ? 's' : ''}`, classe: '' },
      { rotulo: 'cobertas na noite', valor: String(d.cobertas), sub: `${d.lancamentos} lançamentos`, classe: '' },
      { rotulo: 'em aberto agora', valor: real2(d.agora.emAberto_cent), sub: `${d.agora.abertas} mesa${d.agora.abertas !== 1 ? 's' : ''} aberta${d.agora.abertas !== 1 ? 's' : ''}`, classe: 'em-aberto' },
      ...(d.agora.chamadas ? [{ rotulo: 'chamando agora', valor: String(d.agora.chamadas), sub: 'mesa(s) esperando', classe: 'chamando' }] : [])
    ];

    /* ─── gráfico por hora ─── */
    let graficoHtml = '';
    if (d.porHora.length) {
      const max = Math.max(...d.porHora.map(x => x.total_cent));
      const pico = d.porHora.find(x => x.total_cent === max);
      graficoHtml = `<section class="secao">
        <h2>receita por hora</h2>
        <div class="grafico">${d.porHora.map(x => `
          <div class="colGraf${x === pico ? ' pico' : ''}">
            <span class="val">${real2(x.total_cent)}</span>
            <div class="barra" style="height:${Math.round(x.total_cent / max * 80)}px"></div>
            <span class="hora">${h(x.hora)}</span>
          </div>`).join('')}</div>
      </section>`;
    }

    /* ─── ranking de itens ─── */
    let rankHtml = '';
    if (d.topItens.length) {
      rankHtml = `<section class="secao">
        <h2>itens mais vendidos na noite</h2>
        <div class="rank">${d.topItens.map((i, k) => `
          <div class="rank-item">
            <span class="pos">${k + 1}</span>
            <span class="nome">${esc(i.nome)}</span>
            <span class="qtd">${i.qtd}×</span>
            <span class="total">${real2(i.total_cent)}</span>
          </div>`).join('')}</div>
      </section>`;
    }

    $('#dash').innerHTML = semVendas
      ? '<p class="vazio-noite">Nenhuma venda registrada ainda nesta virada.</p>'
      : `<div class="painel">${metricas.map(m =>
          `<div class="metrica ${m.classe}"><p class="rotulo">${esc(m.rotulo)}</p>
           <p class="valor">${esc(m.valor)}</p>
           <p class="sub">${esc(m.sub)}</p></div>`).join('')}</div>
        ${graficoHtml}${rankHtml}
        <p class="atualizacao">última atualização: ${new Date().toLocaleTimeString('pt-BR')} · virada de ${new Date(d.inicio).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</p>`;
  }

  $('#atualizar').onclick = carregar;
  carregar();
  setInterval(carregar, 120000);
  addEventListener('visibilitychange', () => { if (!document.hidden) carregar(); });
})();
</script>
</body>
</html>
