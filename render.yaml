# Blueprint do Render — instância FREE.
#
# O que o free impõe, e como cada coisa foi tratada:
#   sem disco persistente  → o banco vive num sistema de arquivos efêmero.
#                            Por isso existe o retrato externo: a cada mudança
#                            (e sempre no desligamento) o salao.db comprimido
#                            sobe para um repositório PRIVADO do GitHub, e volta
#                            de lá no arranque. Sem SNAP_REPO e SNAP_TOKEN o
#                            sistema roda, avisa na tela que os dados são
#                            voláteis, e perde tudo no próximo restart.
#   hiberna em 15 min      → o primeiro acesso da noite espera ~1 min. Abra a
#                            tela do salão alguns minutos antes de abrir a casa.
#   750 h de instância/mês → não fique pingando para manter acordado: o mês tem
#                            744 h e o ping consome a cota inteira. Deixe hibernar.
#   sem shell, sem job     → a carga inicial roda sozinha no arranque (seed.js é
#                            chamado pelo server.js). Nada a rodar na mão.
services:
  - type: web
    name: burguer-salao
    runtime: node
    plan: free
    buildCommand: "echo sem dependencias"
    startCommand: "node server.js"
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_VERSION
        value: "22"                 # node:sqlite exige Node 22 ou mais novo
      - key: CASA_NOME
        value: Burguer
      - key: CASA_CIDADE
        value: GOIANIA
      - key: SERVICO_PCT
        value: "10"
      - key: PIX_CHAVE              # preencher no painel; não vai no repositório
        sync: false
      - key: PIX_NOME
        value: BURGUER
      # --- IA: assistente do cliente, da equipe e camada 2 da câmera ---
      - key: ANTHROPIC_API_KEY      # console.anthropic.com → API Keys (com crédito em Billing)
        sync: false

      # --- nota fiscal (NFC-e) pela Focus NFe ---
      - key: FOCUS_NFE_TOKEN        # token da Focus; sem ele sai comprovante SEM VALOR FISCAL
        sync: false
      - key: FOCUS_NFE_CNPJ         # CNPJ do emitente cadastrado na Focus
        sync: false
      - key: FOCUS_NFE_AMBIENTE     # homologacao até o contador revisar o cadastro fiscal
        value: homologacao
      - key: NFCE_AUTO              # 1 = toda conta fechada emite a nota
        value: "0"

      - key: SESSAO_SEGREDO         # assina as sessões; sem ele, cada restart desloga todo mundo
        generateValue: true         # no Blueprint o Render sorteia; no serviço manual, crie à mão

      # --- retrato externo: é isto que segura os dados no plano free ---
      - key: SNAP_REPO              # ex.: MarcusAndMarcus/burguer-dados (PRIVADO)
        sync: false
      - key: SNAP_TOKEN             # PAT fine-grained, só esse repo, Contents: R/W
        sync: false
      - key: SNAP_ARQUIVO
        value: salao.db.gz
      - key: SNAP_INTERVALO         # segundos entre retratos, se houver mudança
        value: "600"
      - key: SNAP_DEBOUNCE          # espera depois de uma mudança antes de subir
        value: "120"
      - key: DIAS_EVENTO            # telemetria URB1 mais velha que isso é podada
        value: "7"
