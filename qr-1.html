<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa · Bahrem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:    #120d0b;
  --papel: #f2e9d8;
  --sub:   #9c8b73;
  --borda: #3a2a21;
  --latao: #c08a2e;
  --marca: #e30613;
}
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--papel);
  font-family: "Archivo", sans-serif;
  min-height: 100dvh;
  display: grid;
  place-items: center;
}

body::before {
  content: "";
  position: fixed; inset: -24px;
  background: url(/casa.jpg) center/cover no-repeat;
  filter: blur(8px) saturate(.7);
  transform: scale(1.04);
  z-index: 0;
}
body::after {
  content: "";
  position: fixed; inset: 0;
  background: linear-gradient(180deg, rgba(18,13,11,.90), rgba(18,13,11,.95));
  z-index: 0;
}
body > * { position: relative; z-index: 1; }

.cartao {
  text-align: center;
  padding: 32px 28px 28px;
  background: rgba(26,18,14,.88);
  border: 1px solid var(--borda);
  border-radius: 10px;
  width: min(340px, 95vw);
  backdrop-filter: blur(6px);
}

.logo {
  width: 48px; height: 48px;
  border-radius: 7px;
  margin: 0 auto 14px;
  display: block;
}

.numero {
  font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -.04em;
  margin: 0 0 4px;
}
.area-label {
  font-size: 12px; color: var(--sub); letter-spacing: .08em; margin: 0 0 20px;
}

.qr-moldura {
  display: inline-flex;
  padding: 14px;
  background: var(--bg);
  border: 1px solid var(--borda);
  border-radius: 8px;
}

.instrucao {
  font-size: 13px; color: var(--sub);
  margin: 18px 0 0;
  line-height: 1.5;
}
.instrucao b { color: var(--papel); font-weight: 600; }

.separador {
  width: 40px; height: 2px;
  background: var(--latao);
  margin: 16px auto;
  border-radius: 1px;
}

.codigo {
  font-family: "Courier New", monospace;
  font-size: 11px; letter-spacing: .16em;
  color: #6b5c48;
}

.rodape {
  margin-top: 18px;
  font-size: 11px; color: #5a4838;
}

/* Modo impressão: tira o fundo, deixa preto no branco */
@media print {
  body::before, body::after { display: none; }
  body { background: #fff; color: #000; }
  .cartao { background: #fff; border-color: #ccc; }
  .qr-moldura { background: #fff; }
  .instrucao, .area-label { color: #555; }
  .codigo { color: #888; }
  .rodape { color: #aaa; }
}
</style>
</head>
<body>
<div class="cartao">
  <img class="logo" src="/marca.png" alt="Bahrem Marista">
  <p class="numero" id="num">—</p>
  <p class="area-label" id="area"></p>
  <div class="qr-moldura">
    <div id="qr"></div>
  </div>
  <p class="instrucao">Aponte a câmera do celular para o QR acima,<br>
    <b>veja sua conta em tempo real e faça pedidos</b></p>
  <div class="separador"></div>
  <p class="codigo" id="cod"></p>
  <p class="rodape">Bahrem Marista · Setor Marista · Goiânia</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
  integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA=="
  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const mesa = q.get('mesa') || '';
  const area = q.get('area') || '';
  const codigo = (q.get('c') || '').toUpperCase();
  const urlAlvo = q.get('url') ||
    (location.origin + '/mesa?c=' + encodeURIComponent(codigo));

  document.getElementById('num').textContent = mesa ? `Mesa ${mesa}` : '—';
  document.getElementById('area').textContent = area ? area.toUpperCase() : '';
  document.getElementById('cod').textContent = codigo || urlAlvo;

  new QRCode(document.getElementById('qr'), {
    text: urlAlvo,
    width: 224, height: 224,
    colorDark: '#f2e9d8',  /* papel */
    colorLight: '#120d0b', /* garrafa */
    correctLevel: QRCode.CorrectLevel.M
  });
})();
</script>
</body>
</html>
