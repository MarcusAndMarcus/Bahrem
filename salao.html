<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salão · Bahrem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,800;1,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/bahrem.css">
</head>
<body>

<header class="topo">
  <img class="selo" src="/marca.png" alt="Bahrem">
  <div class="marca">Bahrem <span>Marista</span></div>
  <div class="resumo" id="resumo"></div>
  <div class="vaga"></div>
  <div class="resumo"><span id="quem"></span><button class="btn miudo" id="sair">sair</button></div>
</header>

<nav class="abas">
  <a href="/salao" class="aqui">Salão</a>
  <a href="/passe">Passe<span class="nav-badge" id="badgePasse" hidden></span></a>
  <a href="/camera">Câmera</a>
  <a href="/noite">Noite</a>
  <a href="/cardapio">Cardápio</a>
</nav>

<div class="pilhas" id="filtros"></div>

<div class="urb1">
  <span class="quadros" id="urb1">URB1 — barramento ligando…</span>
  <span class="dados" id="dados"></span>
</div>

<div id="caixinhaSalao"></div>

<main id="salao"></main>

<aside class="gaveta" id="gaveta" aria-hidden="true">
  <header>
    <h3 id="gTitulo">Mesa</h3>
    <button class="fechar" id="gFechar" aria-label="fechar">×</button>
  </header>
  <div class="corpo" id="gCorpo"></div>
  <div class="pe" id="gPe"></div>
</aside>

<script src="/app.js"></script>
<script src="/alerta.js"></script>
<script src="/caixinha.js"></script>
<script>
(function () {
  const { $, $$, esc, real, decorrido, api, guarda, escutar } = B;
  const NOMES = { salao: 'Salão', deck: 'Deck', mezanino: 'Mezanino' };
  const ESTADOS = { pendente: 'na fila', preparo: 'preparando', pronto: 'pronto',
    entregue: 'entregue', sugerido: 'pedido do cliente', recusado: 'recusado' };
  const TICKET_CHEIO = 40000;      // o copo enche aqui
  const ESPERA_LONGA = 20 * 60000; // acima disso a mesa aparece como atrasada

  let estado = null, cardapio = [], mesaAberta = null, gAba = 'comanda', telegramas = [], filtro = 'todas';

  const nivel = cent => Math.max(3, Math.min(100, Math.round(cent / TICKET_CHEIO * 100)));
  const atrasada = m => m.esperandoDesde && Date.now() - Date.parse(m.esperandoDesde) > ESPERA_LONGA;

  async function carregar() {
    estado = await api('/api/salao');
    if (!cardapio.length) cardapio = await api('/api/cardapio');
    desenhar();
    if (mesaAberta) abrirGaveta(mesaAberta, true);
  }

  function desenhar() {
    const r = estado.resumo;
    $('#resumo').innerHTML =
      `<span><b>${r.abertas}</b> de ${r.mesas} mesas</span>` +
      `<span><b>${r.pessoas}</b> pessoas</span>` +
      `<span class="grana">${real(r.emAberto_cent)} em aberto</span>` +
      `<span>ticket ${real(r.ticket_cent)}</span>`;
    $('#quem').textContent = `${estado.eu.nome} · ${estado.eu.papel}`;
    montarCaixinha();
    const naFila = estado.mesas.reduce((a, m) => a + (m.status === 'ocupada' ? (m.prontos || 0) : 0), 0);
    $('#badgePasse').hidden = !naFila;
    $('#badgePasse').textContent = naFila;

    const atrasadas = estado.mesas.filter(m => m.status === 'ocupada' && atrasada(m)).length;
    const filtros = [
      ['todas', `todas <b>${r.abertas}</b>`, false],
      ['chamando', `chamando <b>${r.chamadas}</b>`, r.chamadas > 0],
      ['pedidos', `pedidos do cliente <b>${r.sugeridos}</b>`, r.sugeridos > 0],
      ['prontos', `prontos para levar <b>${r.prontos}</b>`, false],
      ['atrasadas', `esperando há mais de 20 min <b>${atrasadas}</b>`, atrasadas > 0],
      ['livres', `livres <b>${r.livres}</b>`, false]
    ];
    $('#filtros').innerHTML = filtros.map(([k, texto, urgente]) =>
      `<button class="pilha${filtro === k ? ' aqui' : ''}${urgente ? ' urgente' : ''}" data-f="${k}">${texto}</button>`).join('');
    $$('#filtros [data-f]').forEach(b => b.onclick = () => { filtro = b.dataset.f; desenhar(); });

    const passa = m => {
      if (filtro === 'todas') return true;
      if (filtro === 'livres') return m.status !== 'ocupada';
      if (m.status !== 'ocupada') return false;
      if (filtro === 'chamando') return Boolean(m.chamada);
      if (filtro === 'pedidos') return m.sugeridos > 0;
      if (filtro === 'prontos') return m.prontos > 0;
      if (filtro === 'atrasadas') return atrasada(m);
      return true;
    };
    const visiveis = estado.mesas.filter(passa);
    const areas = [...new Set(visiveis.map(m => m.area))];
    $('#salao').innerHTML = areas.length ? areas.map(a => `
      <section class="area">
        <h2>${esc(NOMES[a] || a)}</h2>
        <div class="grade">${visiveis.filter(m => m.area === a).map(cartao).join('')}</div>
      </section>`).join('')
      : '<p class="vazio" style="padding:30px 20px">Nenhuma mesa neste filtro.</p>';
    $$('#salao .mesa').forEach(b => {
      b.onclick = ev => {
        const acao = ev.target.closest('.acao-rapida');
        if (acao) { ev.stopPropagation(); return acaoRapida(acao); }
        abrirGaveta(Number(b.dataset.n));
      };
      b.onkeydown = ev => {
        if ((ev.key === 'Enter' || ev.key === ' ') && ev.target === b) {
          ev.preventDefault(); abrirGaveta(Number(b.dataset.n));
        }
      };
    });
  }

  /* O cartão é um div com papel de botão, não um <button>: ele carrega o
     botão da ação do momento, e botão dentro de botão não é HTML válido. */
  function cartao(m) {
    if (m.status !== 'ocupada') {
      return `<div class="mesa livre" role="button" tabindex="0" data-n="${m.numero}"
          aria-label="mesa ${m.numero}, livre, ${m.lugares} lugares"><div class="copo"></div>
        <div class="num">${m.numero}</div><div class="sit">${m.lugares} lugares</div>
        <div class="val">${m.status === 'reservada' ? 'reservada' : 'livre'}</div></div>`;
    }
    const marcas = [];
    if (m.sugeridos) marcas.push(`<span class="selo-estado sugerido">${m.sugeridos} pedido${m.sugeridos > 1 ? 's' : ''}</span>`);
    if (m.prontos) marcas.push(`<span class="selo-estado pronto">${m.prontos} pronto${m.prontos > 1 ? 's' : ''}</span>`);

    /* espera da comida mais antiga, como barra: se lê de longe, sem ler número.
       Cheia = ESPERA_LONGA; passou disso, fica vermelha. */
    let espera = '';
    if (m.esperandoDesde) {
      const ms = Date.now() - Date.parse(m.esperandoDesde);
      const fracao = Math.min(1, ms / ESPERA_LONGA);
      espera = `<div class="espera${ms > ESPERA_LONGA ? ' estourou' : ''}"
        title="comida esperando há ${Math.round(ms / 60000)} min"><i style="width:${(fracao * 100).toFixed(0)}%"></i></div>`;
    }

    /* a ação do momento: o que esta mesa precisa de você agora, em um toque */
    let acao = '';
    if (m.sugeridos) acao = `<button class="acao-rapida" data-acao="aceitar" data-n="${m.numero}">aceitar ${m.sugeridos}</button>`;
    else if (m.prontos) acao = `<button class="acao-rapida" data-acao="levar" data-n="${m.numero}">levei ${m.prontos}</button>`;
    else if (m.chamada === 'pediu-conta') acao = `<button class="acao-rapida" data-acao="fechar" data-n="${m.numero}">fechar conta</button>`;

    return `<div class="mesa${m.chamada || atrasada(m) ? ' chamando' : ''}" role="button" tabindex="0"
        data-n="${m.numero}" aria-label="mesa ${m.numero}, ${real(m.total_cent)}${m.chamada ? ', chamando' : ''}">
      <div class="copo"><i style="height:${nivel(m.total_cent)}%"><u></u></i></div>
      ${m.chamada ? '<span class="sino" title="chamou"></span>' : ''}
      <div class="num">${m.numero}</div>
      <div class="sit">${m.pessoas} pess. · ${decorrido(m.aberta_em)} · ${m.itens} itens</div>
      <div class="val">${real(m.total_cent)}</div>
      ${marcas.length ? `<div class="marcas">${marcas.join('')}</div>` : ''}
      ${acao}
      ${espera}
    </div>`;
  }

  /* executa a ação do cartão sem abrir a gaveta */
  async function acaoRapida(botao) {
    const m = estado.mesas.find(x => x.numero === Number(botao.dataset.n));
    if (!m) return;
    if (botao.dataset.acao === 'fechar') {
      await abrirGaveta(m.numero);
      const c = await api(`/api/comandas/${m.comanda_id}`);
      return confirmarFechamento(m, c);
    }
    botao.disabled = true;
    botao.textContent = '…';
    try {
      const c = await api(`/api/comandas/${m.comanda_id}`);
      if (botao.dataset.acao === 'aceitar') {
        for (const i of c.itens.filter(x => x.estado === 'sugerido'))
          await api(`/api/lancamentos/${i.id}/aprovar`, { method: 'POST' });
      } else if (botao.dataset.acao === 'levar') {
        for (const i of c.itens.filter(x => x.estado === 'pronto'))
          await api(`/api/lancamentos/${i.id}/estado`, { method: 'POST', corpo: { estado: 'entregue' } });
      }
    } catch (e) {
      if (window.Alerta) Alerta.aviso(e.message);
    }
    carregar();
  }

  /* ---------- gaveta ---------- */
  async function abrirGaveta(numero, silencioso) {
    const m = estado.mesas.find(x => x.numero === numero);
    if (!m) return;
    if (mesaAberta !== numero) gAba = 'comanda';
    mesaAberta = numero;
    $('#gTitulo').textContent = `Mesa ${numero}`;
    $('#gaveta').classList.add('aberta');
    $('#gaveta').setAttribute('aria-hidden', 'false');
    if (m.status !== 'ocupada') return telaAbrir(m);
    const c = await api(`/api/comandas/${m.comanda_id}`);
    telaMesa(m, c, silencioso);
  }

  function fecharGaveta() {
    mesaAberta = null;
    $('#gaveta').classList.remove('aberta');
    $('#gaveta').setAttribute('aria-hidden', 'true');
  }
  $('#gFechar').onclick = fecharGaveta;
  addEventListener('keydown', e => e.key === 'Escape' && fecharGaveta());

  function telaAbrir(m) {
    $('#gCorpo').innerHTML = `
      <p class="vazio">Mesa livre, ${m.lugares} lugares. Quantas pessoas sentaram?</p>
      <div class="campo"><label for="qp">Pessoas</label>
        <input id="qp" type="number" inputmode="numeric" min="1" max="30" value="${m.lugares}"></div>`;
    $('#gPe').innerHTML = `<button class="btn forte" id="abrir">Abrir comanda</button>`;
    $('#abrir').onclick = async () => {
      $('#abrir').disabled = true;
      try {
        await api(`/api/mesas/${m.numero}/abrir`, { method: 'POST', corpo: { pessoas: Number($('#qp').value) || 1 } });
        await carregar();
      } catch (e) { alerta(e.message); $('#abrir').disabled = false; }
    };
  }

  function telaMesa(m, c, silencioso) {
    const sugeridos = c.itens.filter(i => i.estado === 'sugerido');
    $('#gCorpo').innerHTML = `
      <div class="abinhas" id="gAbas">
        <button data-g="comanda" class="${gAba === 'comanda' ? 'aqui' : ''}">Comanda
          <span class="conta-badge">${real(c.total_cent)}</span></button>
        <button data-g="pedidos" class="${gAba === 'pedidos' ? 'aqui' : ''}">Pedidos
          ${sugeridos.length ? `<span class="conta-badge">${sugeridos.length}</span>` : ''}</button>
        <button data-g="mesa" class="${gAba === 'mesa' ? 'aqui' : ''}">Mesa</button>
      </div>
      <div id="gPainel"></div>`;
    $$('#gAbas button').forEach(b => b.onclick = () => { gAba = b.dataset.g; telaMesa(m, c); });
    if (gAba === 'comanda') painelComanda(m, c);
    if (gAba === 'pedidos') painelPedidos(m, c, sugeridos);
    if (gAba === 'mesa') painelMesa(m, c);
    if (!silencioso) $('#gCorpo').scrollTop = 0;
  }

  function painelComanda(m, c) {
    const naConta = c.itens.filter(i => i.estado !== 'sugerido' && i.estado !== 'recusado');
    const p = c.porPessoa_cent;
    const faixa = p.length > 1 && Math.min(...p) !== Math.max(...p)
      ? `${real(Math.min(...p))} a ${real(Math.max(...p))}` : real(p[0] || 0);
    $('#gPainel').innerHTML = `
      <div class="resumo" style="margin-bottom:14px">
        <span>${c.pessoas} pessoas</span><span>aberta há ${decorrido(c.comanda.aberta_em)}</span>
        ${m.chamada ? `<span style="color:var(--marca)">${m.chamada === 'pediu-conta' ? 'pediu a conta' : 'chamou o garçom'}</span>` : ''}
      </div>
      <div class="comanda">
        ${naConta.length ? naConta.map(i => `
          <div class="linha">
            <span class="q">${i.qtd}×</span>
            <span class="n">${esc(i.nome)}
              ${i.observacao ? `<small>${esc(i.observacao)}</small>` : ''}
              <small><span class="selo-estado ${esc(i.estado)}">${ESTADOS[i.estado]}</span>
                ${i.origem !== 'garcom' ? ` · ${esc(i.origem)}` : ''}</small></span>
            <span class="v">${real(i.qtd * i.preco_cent)}
              <button class="btn miudo perigo" data-estorno="${i.id}" title="estornar">−</button></span>
          </div>`).join('') : '<p class="vazio">Nada lançado ainda.</p>'}
        <div class="soma"><span>subtotal</span><span>${real(c.subtotal_cent)}</span></div>
        ${c.desconto_cent ? `<div class="soma"><span>desconto (${esc(c.desconto_motivo || '')})</span><span>− ${real(c.desconto_cent)}</span></div>` : ''}
        <div class="soma"><span>serviço ${c.servico_pct}%</span><span>${real(c.servico_cent)}</span></div>
        <div class="soma total"><span>total</span><b>${real(c.total_cent)}</b></div>
      </div>
      <div class="rateio">${c.rateado ? 'rateado por item' : `por pessoa (${c.pessoas})`}: <b>${faixa}</b></div>

      <h2 style="margin:22px 0 8px;font-size:13px;color:var(--papel-2)">Lançar item</h2>
      <div class="campo"><label for="item">Item do cardápio</label>
        <select id="item">${cardapio.map(i =>
          `<option value="${i.id}">${esc(i.nome)} — ${real(i.preco_cent)}</option>`).join('')}</select></div>
      <div style="display:grid;grid-template-columns:90px 1fr;gap:10px">
        <div class="campo"><label for="qtd">Qtd</label>
          <input id="qtd" type="number" inputmode="numeric" min="1" max="99" value="1"></div>
        <div class="campo"><label for="obs">Observação</label>
          <input id="obs" maxlength="140" placeholder="ponto, sem cebola…"></div>
      </div>
      <button class="btn" id="lancar">Lançar na mesa ${m.numero}</button>
      <p class="nota">Conta do cliente: <code>${esc(c.comanda.codigo)}</code></p>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
        <a class="qr-btn" href="/mesa?c=${encodeURIComponent(c.comanda.codigo)}" target="_blank" rel="noopener">abrir a tela do cliente</a>
        <a class="qr-btn" href="/qr?mesa=${m.numero}&area=${encodeURIComponent(m.area)}&c=${encodeURIComponent(c.comanda.codigo)}" target="_blank" rel="noopener">QR desta mesa</a>
      </div>`;

    $('#lancar').onclick = async () => {
      try {
        await api(`/api/comandas/${c.comanda.id}/itens`, { method: 'POST',
          corpo: { item_id: Number($('#item').value), qtd: Number($('#qtd').value) || 1,
            observacao: $('#obs').value } });
        await carregar();
      } catch (e) { alerta(e.message); }
    };
    /* estorno sem diálogo de confirmação: diálogo todo mundo aprende a clicar
       sem ler. Em vez disso, o estorno acontece e aparece "desfazer" por 10 s
       (o servidor aceita desfazer por 2 min). */
    $$('#gPainel [data-estorno]').forEach(b => b.onclick = async ev => {
      ev.stopPropagation();
      const id = b.dataset.estorno;
      const nome = b.closest('.linha')?.querySelector('.n')?.firstChild?.textContent?.trim() || 'item';
      try {
        await api(`/api/lancamentos/${id}`, { method: 'DELETE' });
        await carregar();
        if (window.Alerta) Alerta.acao(`${nome} estornado`, 'desfazer', async () => {
          try { await api(`/api/lancamentos/${id}/desfazer`, { method: 'POST' }); await carregar(); }
          catch (e2) { Alerta.aviso(e2.message); }
        }, 10000);
      } catch (e) { alerta(e.message); }
    });
    $('#gPe').innerHTML = `
      <button class="btn" id="camera">Lançar pela câmera</button>
      <button class="btn forte" id="fechar">Fechar conta — ${real(c.total_cent)}</button>`;
    $('#camera').onclick = () => location.href = `/camera?mesa=${m.numero}&comanda=${c.comanda.id}`;
    $('#fechar').onclick = () => confirmarFechamento(m, c);
  }

  function painelPedidos(m, c, sugeridos) {
    $('#gPainel').innerHTML = sugeridos.length ? `
      <p class="nota" style="margin-top:0">Pedidos feitos pelo celular do cliente. Nada foi para a
        cozinha e nada entrou na conta até você aceitar.</p>
      <div class="comanda">${sugeridos.map(i => `
        <div class="linha" style="display:block">
          <div style="display:flex;gap:10px"><span class="q">${i.qtd}×</span>
            <span class="n">${esc(i.nome)}${i.observacao ? `<small>${esc(i.observacao)}</small>` : ''}</span>
            <span class="v">${real(i.qtd * i.preco_cent)}</span></div>
          <div style="display:flex;gap:6px;margin-top:8px">
            <button class="btn miudo forte" data-ok="${i.id}">aceitar</button>
            <button class="btn miudo perigo" data-nao="${i.id}">recusar</button>
          </div></div>`).join('')}</div>`
      : '<p class="vazio">Nenhum pedido do cliente esperando.</p>';
    $('#gPe').innerHTML = sugeridos.length
      ? `<button class="btn forte" id="tudo">Aceitar os ${sugeridos.length}</button>` : '';
    const decidir = async (id, acao) => {
      try { await api(`/api/lancamentos/${id}/${acao}`, { method: 'POST' }); await carregar(); }
      catch (e) { alerta(e.message); }
    };
    $$('#gPainel [data-ok]').forEach(b => b.onclick = () => decidir(b.dataset.ok, 'aprovar'));
    $$('#gPainel [data-nao]').forEach(b => b.onclick = () => decidir(b.dataset.nao, 'recusar'));
    const tudo = $('#tudo');
    if (tudo) tudo.onclick = async () => {
      tudo.disabled = true;
      for (const i of sugeridos) await decidir(i.id, 'aprovar');
    };
  }

  function painelMesa(m, c) {
    const livres = estado.mesas.filter(x => x.status !== 'ocupada');
    const gerente = estado.eu.papel === 'gerente';
    $('#gPainel').innerHTML = `
      <div class="campo"><label for="pessoas">Pessoas na mesa</label>
        <input id="pessoas" type="number" inputmode="numeric" min="1" max="40" value="${c.pessoas}"></div>
      <div class="campo"><label for="nomes">Nomes (separados por vírgula, para o rateio)</label>
        <input id="nomes" maxlength="200" value="${esc(c.nomes.join(', '))}"></div>
      <button class="btn" id="salvarPessoas">Salvar</button>

      <h2 style="margin:22px 0 8px;font-size:13px;color:var(--papel-2)">Transferir a comanda</h2>
      ${livres.length ? `<div class="campo"><select id="destino">${livres.map(x =>
        `<option value="${x.numero}">Mesa ${x.numero} — ${esc(NOMES[x.area] || x.area)}, ${x.lugares} lugares</option>`).join('')}</select></div>
        <button class="btn" id="transferir">Levar para a mesa escolhida</button>`
      : '<p class="vazio">Nenhuma mesa livre no momento.</p>'}

      <h2 style="margin:22px 0 8px;font-size:13px;color:var(--papel-2)">Desconto</h2>
      ${gerente ? `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div class="campo"><label for="dtipo">Tipo</label><select id="dtipo">
            <option value="percentual">percentual</option><option value="valor">valor em reais</option>
          </select></div>
          <div class="campo"><label for="dvalor">Quanto</label>
            <input id="dvalor" type="number" inputmode="decimal" min="0" step="0.01" value="${c.desconto_cent ? (c.desconto_cent / 100).toFixed(2) : ''}"></div>
        </div>
        <div class="campo"><label for="dmotivo">Motivo (obrigatório, fica gravado)</label>
          <input id="dmotivo" maxlength="120" value="${esc(c.desconto_motivo || '')}"></div>
        <button class="btn" id="aplicarDesconto">Aplicar desconto</button>`
      : `<p class="nota" style="margin-top:0">Desconto e cortesia só com o PIN do gerente.
          ${c.desconto_cent ? `Nesta comanda já há ${real(c.desconto_cent)} de desconto — ${esc(c.desconto_motivo || '')}.` : ''}</p>`}`;
    $('#gPe').innerHTML = '';

    $('#salvarPessoas').onclick = async () => {
      const nomes = $('#nomes').value.split(',').map(s => s.trim()).filter(Boolean);
      try {
        await api(`/api/comandas/${c.comanda.id}/pessoas`, { method: 'POST',
          corpo: { pessoas: Number($('#pessoas').value) || c.pessoas, nomes: nomes.length ? nomes : null } });
        await carregar();
      } catch (e) { alerta(e.message); }
    };
    const tr = $('#transferir');
    if (tr) tr.onclick = async () => {
      tr.disabled = true;
      try {
        const r = await api(`/api/comandas/${c.comanda.id}/transferir`, { method: 'POST',
          corpo: { mesa: Number($('#destino').value) } });
        mesaAberta = r.para; await carregar();
      } catch (e) { alerta(e.message); tr.disabled = false; }
    };
    const dd = $('#aplicarDesconto');
    if (dd) dd.onclick = async () => {
      const tipo = $('#dtipo').value;
      const bruto = Number($('#dvalor').value) || 0;
      try {
        await api(`/api/comandas/${c.comanda.id}/desconto`, { method: 'POST',
          corpo: { tipo, valor: tipo === 'valor' ? Math.round(bruto * 100) : bruto, motivo: $('#dmotivo').value } });
        gAba = 'comanda'; await carregar();
      } catch (e) { alerta(e.message); }
    };
  }

  /* ── fechamento: a conta não fecha sem dizer como o dinheiro entrou ──
     Um toque na forma já preenche o que falta: o caso comum (uma forma só)
     vira dois toques. Dividir entre formas é só tocar na segunda. */
  const FORMAS = [['dinheiro', 'dinheiro'], ['pix', 'pix'], ['credito', 'crédito'],
    ['debito', 'débito'], ['voucher', 'voucher']];

  function confirmarFechamento(m, c) {
    let semServico = false, linhas = [];
    const totalCom = () => semServico
      ? c.subtotal_cent - c.desconto_cent
      : c.total_cent;
    const somado = () => linhas.reduce((a, l) => a + (l.valor || 0), 0);
    const falta = () => totalCom() - somado();

    const aindaNaCozinha = c.itens.filter(i => i.estado === 'pendente' || i.estado === 'preparo').length;
    const esperando = c.itens.filter(i => i.estado === 'sugerido').length;

    function tela() {
      const f = falta();
      $('#gCorpo').innerHTML = `
        ${aindaNaCozinha ? `<div class="veredito ruim">${aindaNaCozinha} item(ns) ainda na cozinha.</div>` : ''}
        ${esperando ? `<div class="veredito duvida">${esperando} pedido(s) do cliente sem resposta — serão descartados.</div>` : ''}
        <div class="comanda">
          <div class="soma"><span>subtotal</span><span>${real(c.subtotal_cent)}</span></div>
          ${c.desconto_cent ? `<div class="soma"><span>desconto</span><span>− ${real(c.desconto_cent)}</span></div>` : ''}
          <div class="soma"><span>serviço ${semServico ? 0 : c.servico_pct}%</span>
            <span>${real(semServico ? 0 : c.servico_cent)}</span></div>
          <div class="soma total"><span>total</span><b>${real(totalCom())}</b></div>
        </div>
        <label style="display:flex;gap:8px;align-items:center;margin:14px 0;font-size:13px">
          <input type="checkbox" id="semServ" ${semServico ? 'checked' : ''}>
          o cliente dispensou os ${c.servico_pct}% de serviço</label>

        <h2 style="margin:18px 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
          color:var(--papel-3);font-family:var(--mono)">Como o cliente pagou</h2>
        <div class="pilhas" style="padding:0 0 10px">${FORMAS.map(([k, rotulo]) =>
          `<button class="pilha" data-forma="${k}">${rotulo}</button>`).join('')}</div>

        ${linhas.length ? `<div class="comanda">${linhas.map((l, i) => `
          <div class="linha" style="display:block">
            <div style="display:flex;gap:10px;align-items:center">
              <span class="n">${esc(FORMAS.find(x => x[0] === l.forma)[1])}</span>
              <input data-valor="${i}" type="number" inputmode="decimal" step="0.01" min="0"
                value="${(l.valor / 100).toFixed(2)}"
                style="width:7.5em;background:rgba(6,4,3,.82);border:1px solid var(--risco);
                  border-radius:var(--r2);padding:6px 8px;font-family:var(--mono);font-size:13px;
                  text-align:right;color:var(--papel)">
              <button class="btn miudo perigo" data-tira="${i}">−</button>
            </div>
            ${l.forma === 'dinheiro' ? `
              <div style="display:flex;gap:10px;align-items:center;margin-top:8px">
                <span class="q" style="width:auto;color:var(--papel-3)">recebeu</span>
                <input data-recebido="${i}" type="number" inputmode="decimal" step="0.01" min="0"
                  placeholder="${(l.valor / 100).toFixed(2)}"
                  value="${l.recebido != null ? (l.recebido / 100).toFixed(2) : ''}"
                  style="width:7.5em;background:rgba(6,4,3,.82);border:1px solid var(--risco);
                    border-radius:var(--r2);padding:6px 8px;font-family:var(--mono);font-size:13px;
                    text-align:right;color:var(--papel)">
                <span class="v" style="color:${l.recebido > l.valor ? 'var(--chopp)' : 'var(--papel-3)'}">
                  ${l.recebido != null && l.recebido >= l.valor ? `troco ${real(l.recebido - l.valor)}` : 'troco —'}</span>
              </div>` : ''}
          </div>`).join('')}</div>` : '<p class="vazio" style="padding:14px 0">Toque numa forma acima.</p>'}

        <div class="rateio" style="color:${f === 0 ? 'var(--folha)' : 'var(--marca)'}">
          ${f === 0 ? 'fecha certo' : f > 0 ? `falta <b>${real(f)}</b>` : `sobra <b>${real(-f)}</b>`}
        </div>
        ${c.nomes.map((nome, k) => `<div class="pessoa-cartao"><span>${esc(nome)}</span>
          <b>${real(c.porPessoa_cent[k])}</b></div>`).join('')}`;

      $('#gPe').innerHTML = `
        <button class="btn" id="voltar">Voltar</button>
        <button class="btn forte" id="confirma" ${f === 0 ? '' : 'disabled'}>
          Fechar — ${real(totalCom())}</button>`;

      $('#semServ').onchange = e => {
        semServico = e.target.checked;
        /* o total mudou: reajusta a última linha para a conta continuar fechando */
        if (linhas.length) {
          const resto = totalCom() - linhas.slice(0, -1).reduce((a, l) => a + l.valor, 0);
          linhas[linhas.length - 1].valor = Math.max(0, resto);
        }
        tela();
      };
      $$('#gCorpo [data-forma]').forEach(b => b.onclick = () => {
        const resto = falta();
        if (resto <= 0 && linhas.length) return;
        linhas.push({ forma: b.dataset.forma, valor: resto, recebido: null });
        tela();
      });
      $$('#gCorpo [data-tira]').forEach(b => b.onclick = () => {
        linhas.splice(Number(b.dataset.tira), 1); tela();
      });
      $$('#gCorpo [data-valor]').forEach(inp => inp.onchange = () => {
        linhas[Number(inp.dataset.valor)].valor = Math.max(0, Math.round(Number(inp.value) * 100) || 0);
        tela();
      });
      $$('#gCorpo [data-recebido]').forEach(inp => inp.onchange = () => {
        const v = Math.round(Number(inp.value) * 100);
        linhas[Number(inp.dataset.recebido)].recebido = v > 0 ? v : null;
        tela();
      });
      $('#voltar').onclick = () => abrirGaveta(m.numero);
      $('#confirma').onclick = fechar;
    }

    async function fechar() {
      $('#confirma').disabled = true;
      try {
        const r = await api(`/api/comandas/${c.comanda.id}/fechar`, { method: 'POST',
          corpo: { semServico, pagamentos: linhas.map(l =>
            ({ forma: l.forma, valor_cent: l.valor, recebido_cent: l.recebido })) } });
        $('#gCorpo').innerHTML = `
          <p>Mesa ${m.numero} fechada: <b>${real(r.total_cent)}</b>.</p>
          <div class="comanda">${r.pagamentos.map(p => `<div class="soma">
            <span>${esc(FORMAS.find(x => x[0] === p.forma)?.[1] || p.forma)}</span>
            <span>${real(p.valor_cent)}</span></div>`).join('')}
            ${r.troco_cent ? `<div class="soma"><span>troco</span><span>${real(r.troco_cent)}</span></div>` : ''}
          </div>
          ${r.pix ? `<div class="campo" style="margin-top:14px"><label>Pix copia e cola</label>
              <input readonly value="${esc(r.pix)}" onclick="this.select()"></div>` : ''}
          <p class="nota">${esc(r.aviso_pix)}</p>`;
        $('#gPe').innerHTML = `<button class="btn forte" id="ok">Voltar ao salão</button>`;
        $('#ok').onclick = () => { fecharGaveta(); carregar(); };
      } catch (e) {
        alerta(e.message);
        $('#confirma').disabled = false;
      }
    }

    tela();
  }

  function alerta(msg) {
    const d = document.createElement('div');
    d.className = 'veredito ruim';
    d.textContent = msg;
    ($('#gPainel') || $('#gCorpo')).prepend(d);
    setTimeout(() => d.remove(), 6000);
  }

  /* ---------- caixinha de perguntas da equipe ----------
     Faixa centralizada entre os filtros e a grade de mesas. As sugestões
     mudam com o salão: se alguém pediu a conta, a primeira sugestão é essa. */
  let caixinha = null;
  function sugestoesDoMomento() {
    const r = estado?.resumo;
    if (!r) return [];
    const lista = [];
    if (r.chamadas) lista.push('Quem pediu a conta?');
    if (r.sugeridos) lista.push('Tem pedido do celular parado?');
    if (estado.mesas.some(m => m.status === 'ocupada' && atrasada(m))) lista.push('Quem espera comida há mais tempo?');
    if (r.prontos) lista.push('O que está pronto para levar?');
    for (const t of ['Quem espera comida há mais tempo?', 'Quanto já entrou na noite?', 'Qual mesa está há mais tempo aberta?'])
      if (!lista.includes(t)) lista.push(t);
    return lista.slice(0, 4);
  }
  function montarCaixinha() {
    if (!estado?.casa.assistente) { if (caixinha) caixinha.mostrar(false); return; }
    if (caixinha) { caixinha.mostrar(true); caixinha.atualizarSugestoes(); return; }
    caixinha = Caixinha.montar({
      alvo: '#caixinhaSalao',
      rotulo: 'Assistente do salão',
      titulo: 'O que está pegando agora?',
      subtitulo: 'Ele lê as mesas, o passe e a noite no instante da pergunta — e aponta onde olhar.',
      placeholder: 'Ex.: quem espera comida há mais tempo?',
      sugestoes: sugestoesDoMomento,
      aviso: 'Lê e responde; não abre, não fecha, não lança e não dá desconto. Não estima nem projeta.',
      recolhivel: true, chave: 'bahrem.caixinha.salao',
      enviar: async (pergunta, historico) => {
        const r = await api('/api/assistente', { method: 'POST',
          corpo: { mensagem: pergunta, historico: historico.flatMap(h => [
            { papel: 'cliente', texto: h.pergunta }, { papel: 'assistente', texto: h.texto }]) } });
        return { texto: r.texto, extras: (r.mesas || []).map(n => ({
          rotulo: `abrir mesa ${n}`, acao: () => { abrirGaveta(n); return `mesa ${n}`; } })) };
      }
    });
  }


  /* ── atalho de teclado: digitar o número abre a mesa ──
     Num tablet com teclado ou num PC no caixa, o garçom sabe o número de cor.
     Digita 1-6, Enter, e a gaveta abre — sem procurar na grade. */
  let buscado = '', limpar = null;
  addEventListener('keydown', e => {
    if (e.target.matches('input, select, textarea')) return;
    if (e.key === '/' && caixinha) { e.preventDefault(); caixinha.focar(); return; }
    if (/^[0-9]$/.test(e.key)) {
      buscado = (buscado + e.key).slice(-3);
      mostrarBusca();
    } else if (e.key === 'Enter' && buscado) {
      const n = Number(buscado);
      buscado = ''; mostrarBusca();
      if (estado?.mesas.some(m => m.numero === n)) abrirGaveta(n);
    } else if (e.key === 'Backspace' && buscado) {
      buscado = buscado.slice(0, -1); mostrarBusca();
    }
  });
  function mostrarBusca() {
    clearTimeout(limpar);
    let alvo = $('#busca');
    if (!buscado) { alvo?.remove(); return; }
    if (!alvo) {
      alvo = document.createElement('div');
      alvo.id = 'busca';
      alvo.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);' +
        'z-index:180;background:rgba(14,11,9,.97);border:1px solid var(--latao);' +
        'border-radius:var(--r2);padding:10px 18px;font-family:var(--mono);font-size:15px;' +
        'color:var(--papel);backdrop-filter:blur(8px)';
      document.body.appendChild(alvo);
    }
    const existe = estado?.mesas.some(m => m.numero === Number(buscado));
    alvo.innerHTML = `mesa ${esc(buscado)} ${existe ? '· Enter para abrir' :
      '<span style="color:var(--marca)">não existe</span>'}`;
    limpar = setTimeout(() => { buscado = ''; alvo.remove(); }, 2500);
  }

  $('#sair').onclick = () => { guarda.token = ''; location.href = '/'; };

  /* ---------- estado dos dados ---------- */
  async function verDados() {
    try {
      const s = await (await fetch('/api/saude')).json();
      const d = $('#dados'), v = s.dados.modo !== 'github';
      d.classList.toggle('volatil', v || Boolean(s.dados.erro));
      d.textContent = v ? 'dados voláteis — somem no próximo restart'
        : s.dados.erro ? `retrato falhando: ${s.dados.erro}`
          : s.dados.ultimoRetrato ? `retrato há ${decorrido(s.dados.ultimoRetrato)}${s.dados.pendente ? ' · pendente' : ''}`
            : 'retrato ainda não gravado';
      d.title = 'clique para gravar um retrato agora';
    } catch { $('#dados').textContent = ''; }
  }
  $('#dados').onclick = async () => {
    $('#dados').textContent = 'gravando retrato…';
    try { await api('/api/snapshot', { method: 'POST' }); } catch {}
    verDados();
  };

  /* ---------- tempo real ---------- */
  escutar((tipo, dado) => {
    if (dado.urb1) {
      telegramas = [dado.urb1, ...telegramas].slice(0, 3);
      $('#urb1').textContent = telegramas.join('   ·   ');
    }
    if (window.Alerta) Alerta.toast(tipo, dado);
    carregar();
  }, ligado => {
    if (!ligado) $('#urb1').textContent = 'URB1 — sem ligação com o servidor, tentando de novo…';
  });

  verDados();
  setInterval(verDados, 60000);
  setInterval(() => { if (estado) desenhar(); }, 30000);
  carregar().catch(e => { $('#salao').innerHTML = `<p class="vazio" style="padding:24px">${esc(e.message)}</p>`; });
})();
</script>
</body>
</html>
