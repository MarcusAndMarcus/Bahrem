<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Câmera · Burguer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,800;1,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/burguer.css">
</head>
<body class="pagina-camera">

<header class="topo">
  <div class="marca">Câmera</div>
  <div class="resumo" id="resolucao"></div>
  <div class="vaga"></div>
  <a class="btn miudo" href="/salao">voltar ao salão</a>
</header>

<nav class="abas">
  <a href="/salao">Salão</a>
  <a href="/passe">Passe</a>
  <a href="/camera" class="aqui">Câmera</a>
  <a href="/noite">Noite</a>
  <a href="/cardapio">Cardápio</a>
</nav>

<main class="cam">
  <div class="chips-mesa" id="mesas" aria-label="mesa que recebe o prato"></div>

  <div class="visor" id="visor">
    <video id="video" playsinline muted autoplay></video>
    <img id="foto" hidden alt="">
    <canvas id="sobre" class="sobre"></canvas>
    <div class="estado-cam" id="estado"><span class="bolha">ligando a câmera…</span></div>
  </div>

  <div class="controles-cam">
    <button class="ctl" id="lanterna" hidden title="lanterna" aria-label="lanterna">☀</button>
    <button class="ctl" id="virar" title="trocar de câmera" aria-label="trocar de câmera">⟲</button>
    <button class="ctl ctl-auto" id="auto" aria-pressed="true" title="fotografar sozinho">AUTO</button>
    <button class="disparo" id="tirar" aria-label="fotografar agora"></button>
    <label class="ctl" title="escolher do rolo" aria-label="escolher do rolo">▦
      <input type="file" id="arquivo" accept="image/*" hidden></label>
    <button class="ctl" id="ensinarBtn" title="ensinar um prato" aria-label="ensinar um prato">＋</button>
  </div>

  <label class="auto-lancar"><input type="checkbox" id="autoLancar">
    lançar sozinho quando a geometria tiver certeza (com 3 s para cancelar)</label>

  <section id="ensinar" class="painel" hidden>
    <h2 data-n="E">ensinar um prato <button class="fechar" id="fecharEnsinar" aria-label="sair do modo ensinar">×</button></h2>
    <div class="dentro">
      <div class="campo"><label for="pratoEnsinar">Prato</label><select id="pratoEnsinar"></select></div>
      <p class="nota" style="margin-top:0">Monte o prato do jeito aprovado e aponte a câmera. A cada foto,
        mexa um pouco o prato — gire, empurre — para o padrão aprender a folga. Cinco fotos bastam.</p>
      <div class="pontos" id="pontos"></div>
      <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:10px 0">
        <input type="checkbox" id="fotoCardapio" checked> usar a primeira foto no cardápio (PIN de gerente)</label>
      <button class="btn forte" id="gravarPadrao" disabled>Gravar padrão</button>
    </div>
  </section>

  <div id="saida"></div>
</main>

<script src="/app.js"></script>
<script src="/nucleo.js"></script>
<script src="/captura.js"></script>
<script src="/alerta.js"></script>
<script>
(function () {
  const { $, $$, esc, real, api } = B;
  const q = new URLSearchParams(location.search);
  const PREF = k => `burguer.camera.${k}`;
  const lerPref = (k, d) => { try { const v = localStorage.getItem(PREF(k)); return v == null ? d : v; } catch { return d; } };
  const gravarPref = (k, v) => { try { localStorage.setItem(PREF(k), v); } catch {} };

  let mesa = null;                       // { numero, comanda_id }
  let abertas = [], cardapio = [];
  let fluxo = null, trilha = null, virada = 'environment', luz = false;
  let auto = lerPref('auto', '1') === '1';
  let autoLancar = lerPref('autolancar', '1') === '1';
  let zoom = null, temLanterna = false;
  let ocupado = false, contagem = null, ensino = null, ultimoContorno = null, ultimaDecisao = null;
  const cap = Captura.nova();

  /* ─────────── mesas: para onde vai o prato ─────────── */
  /* O que cada mesa já pediu e ainda não recebeu. É o que impede a câmera de
     cobrar duas vezes o mesmo prato: se a mesa já tem este item esperando, o
     caminho normal deixa de ser "lançar" e passa a ser "marcar entregue". */
  let fila = [];
  async function carregarFila() {
    try { fila = (await api('/api/passe')).fila || []; } catch { fila = []; }
  }
  const esperando = (itemId, mesaNum) => fila.filter(f =>
    f.item_id === itemId && f.estado !== 'entregue' && (mesaNum == null || f.mesa === mesaNum));

  async function carregarMesas() {
    try {
      const s = await api('/api/salao');
      abertas = s.mesas.filter(m => m.status === 'ocupada');
    } catch { abertas = []; }
    const daUrl = Number(q.get('mesa'));
    const guardada = Number(lerPref('mesa', ''));
    const alvo = mesa?.numero ?? (daUrl || guardada || null);
    const m = abertas.find(x => x.numero === alvo);
    mesa = m ? { numero: m.numero, comanda_id: m.comanda_id } : null;
    desenharMesas();
  }
  function desenharMesas() {
    $('#mesas').innerHTML = `<button class="chip-mesa${!mesa ? ' aqui' : ''}" data-m="">só medir</button>` +
      abertas.map(m => `<button class="chip-mesa${mesa?.numero === m.numero ? ' aqui' : ''}" data-m="${m.numero}">
        mesa ${m.numero}</button>`).join('') +
      (abertas.length ? '' : '<span class="nota" style="margin:0">nenhuma mesa aberta</span>');
    $$('#mesas [data-m]').forEach(b => b.onclick = () => escolherMesa(Number(b.dataset.m)));
  }

  function escolherMesa(numero) {
    const m = abertas.find(x => x.numero === numero);
    mesa = m ? { numero: m.numero, comanda_id: m.comanda_id } : null;
    gravarPref('mesa', mesa ? String(mesa.numero) : '');
    desenharMesas();
  }

  /* ─────────── câmera ─────────── */
  async function ligar() {
    if (fluxo) fluxo.getTracks().forEach(t => t.stop());
    try {
      fluxo = await navigator.mediaDevices.getUserMedia({ audio: false,
        video: { facingMode: { ideal: virada }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
    } catch (e) {
      $('#video').hidden = true;
      status(`a câmera não abriu (${e.name || e.message}) — use o rolo`, 'ruim');
      return;
    }
    const v = $('#video');
    v.hidden = false; $('#foto').hidden = true;
    v.srcObject = fluxo;
    trilha = fluxo.getVideoTracks()[0];
    const caps = trilha.getCapabilities ? trilha.getCapabilities() : {};
    $('#lanterna').hidden = !caps.torch;
    zoom = caps.zoom ? { ...caps.zoom, atual: trilha.getSettings().zoom || caps.zoom.min } : null;
    temLanterna = Boolean(caps.torch);
    /* foco contínuo, quando o aparelho deixa escolher */
    if (caps.focusMode && caps.focusMode.includes('continuous'))
      trilha.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
    v.onloadedmetadata = () => {
      $('#resolucao').innerHTML = `<span>${v.videoWidth}×${v.videoHeight}</span>`;
    };
    /* tela acesa enquanto a câmera está aberta */
    try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch {}
  }
  $('#virar').onclick = () => { virada = virada === 'environment' ? 'user' : 'environment'; ligar(); };
  $('#lanterna').onclick = async () => {
    luz = !luz;
    try { await trilha.applyConstraints({ advanced: [{ torch: luz }] }); $('#lanterna').classList.toggle('ligado', luz); }
    catch { luz = false; }
  };
  $('#auto').onclick = () => { auto = !auto; gravarPref('auto', auto ? '1' : '0'); marcarAuto(); };
  const marcarAuto = () => { $('#auto').setAttribute('aria-pressed', String(auto)); $('#auto').classList.toggle('ligado', auto); };
  $('#autoLancar').checked = autoLancar;
  $('#autoLancar').onchange = e => { autoLancar = e.target.checked; gravarPref('autolancar', autoLancar ? '1' : '0'); };

  function status(texto, classe = '') { $('#estado').innerHTML = `<span class="bolha ${classe}">${esc(texto)}</span>`; }

  /* ─────────── guia ao vivo ───────────
     4 leituras por segundo numa cópia pequena do vídeo. Aqui vale o
     reescalonador do navegador (rápido): é só guia. A foto de verdade passa
     pelo caminho determinístico do núcleo. */
  const previa = document.createElement('canvas');
  /* Enquadrar é trabalho da câmera, não do garçom: quando o prato está
     pequeno demais ou grande demais no quadro, o zoom da própria lente
     corrige sozinho, aos poucos, entre uma leitura e outra do guia. Alvo:
     o prato ocupando ~62% do lado menor. Sem zoom no aparelho, nada acontece
     e a medição continua valendo — ela lê em qualquer tamanho. */
  const ALVO_RAIO = 0.31;
  let ajusteEm = 0;
  async function ajustarZoom(r, agora) {
    if (!zoom || !trilha || ocupado || agora - ajusteEm < 900) return;
    if (!r || r.falha || !r.raioRel) return;
    const erro = ALVO_RAIO / r.raioRel;                 // >1 precisa aproximar
    if (erro > 0.82 && erro < 1.22) return;             // já está bom
    const passo = zoom.step || (zoom.max - zoom.min) / 20;
    const alvo = Math.min(zoom.max, Math.max(zoom.min,
      zoom.atual * Math.min(1.35, Math.max(0.74, erro))));
    if (Math.abs(alvo - zoom.atual) < passo / 2) return;
    ajusteEm = agora;
    try { await trilha.applyConstraints({ advanced: [{ zoom: alvo }] }); zoom.atual = alvo; } catch { zoom = null; }
  }

  /* pouca luz e lanterna disponível: acende sozinha */
  let escuras = 0;
  async function ajustarLuz(r) {
    if (!temLanterna || luz || !auto) return;
    escuras = (r && (r.falha ? /contra a luz|escur/.test(r.falha) : r.m && r.m.luminancia < 0.28)) ? escuras + 1 : 0;
    if (escuras < 4) return;
    escuras = 0;
    try { await trilha.applyConstraints({ advanced: [{ torch: true }] }); luz = true;
      $('#lanterna').classList.add('ligado'); status('acendi a lanterna', 'bom'); } catch {}
  }

  function olhar() {
    const v = $('#video');
    if (!document.hidden && !ocupado && !contagem && v.videoWidth && !v.hidden) {
      const e = 320 / Math.max(v.videoWidth, v.videoHeight);
      previa.width = Math.round(v.videoWidth * e); previa.height = Math.round(v.videoHeight * e);
      previa.getContext('2d').drawImage(v, 0, 0, previa.width, previa.height);
      let r;
      try { r = Nucleo.medir(previa, { rapido: true }); } catch { r = { falha: 'sem imagem' }; }
      const d = cap.observar(r, performance.now());
      ultimaDecisao = d;
      ajustarZoom(r, performance.now());
      ajustarLuz(r);
      desenhar(r, d);
      mostrarEstado(r, d);
      if (d.acao === 'capturar' && (auto || ensino)) capturar();
    }
    setTimeout(olhar, 250);
  }

  function mostrarEstado(r, d) {
    const txt = {
      procurando: ['procurando o prato — não precisa centralizar', ''],
      recusa: [r.falha || 'não deu para ler', 'ruim'],
      firmando: [ensino ? 'segure firme…' : auto ? 'segure firme — vou fotografar sozinho' : 'prato encontrado — toque para fotografar', 'bom'],
      travado: ['já lido — tire o prato ou aponte o próximo', 'aviso'],
      mexa: ['mexa um pouco o prato para a próxima foto', 'aviso'],
      capturando: ['fotografando…', 'bom']
    }[d.estado] || ['', ''];
    status(txt[0], txt[1]);
  }

  /* o contorno achado, desenhado por cima do vídeo */
  function desenhar(r, d) {
    const c = $('#sobre'), alvo = $('#video').hidden ? $('#foto') : $('#video');
    const dpr = window.devicePixelRatio || 1, W = alvo.clientWidth, H = alvo.clientHeight;
    if (c.width !== Math.round(W * dpr) || c.height !== Math.round(H * dpr)) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
    const g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    const k = r && r.contorno;
    if (!k) return;
    ultimoContorno = k;
    const cor = !d ? '#3f9e91' : d.estado === 'recusa' ? '#e30613' : d.estado === 'travado' || d.estado === 'mexa' ? '#c08a2e' : '#3f9e91';
    g.save();
    g.translate(k.cx * W, k.cy * H); g.rotate(k.th);
    g.strokeStyle = cor; g.lineWidth = 3; g.setLineDash(d && d.estado === 'travado' ? [8, 6] : []);
    g.beginPath();
    if (k.forma === 'retangulo') g.rect(-k.ea * W, -k.eb * W, 2 * k.ea * W, 2 * k.eb * W);
    else g.ellipse(0, 0, k.ea * W, k.eb * W, 0, 0, 2 * Math.PI);
    g.stroke();
    /* anel de progresso: enche enquanto o prato fica parado */
    if (d && (d.estado === 'firmando' || d.estado === 'capturando') && (auto || ensino)) {
      g.setLineDash([]); g.lineWidth = 6; g.strokeStyle = 'rgba(63,158,145,.9)';
      g.beginPath();
      const R = Math.max(k.ea, k.eb) * W + 10;
      g.ellipse(0, 0, R, R * (k.forma === 'retangulo' ? 1 : k.eb / k.ea), 0, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * d.progresso);
      g.stroke();
    }
    g.restore();
  }

  /* ─────────── fotografar: três quadros e a média ─────────── */
  const espera = ms => new Promise(r => setTimeout(r, ms));
  async function capturar() {
    if (ocupado) return;
    const v = $('#video');
    if (!v.videoWidth) return;
    ocupado = true;
    if (navigator.vibrate) navigator.vibrate(25);
    status('fotografando…', 'bom');
    const quadros = [];
    for (let i = 0; i < 3; i++) {
      const c = document.createElement('canvas');
      c.width = v.videoWidth; c.height = v.videoHeight;
      c.getContext('2d').drawImage(v, 0, 0);
      quadros.push(c);
      if (i < 2) await espera(110);
    }
    status('lendo…', 'bom');
    await espera(0);
    const medidas = [];
    for (const qd of quadros) { medidas.push(Nucleo.medir(qd)); await espera(0); }
    const r = Nucleo.media(medidas);
    cap.capturou(r.contorno || ultimoContorno, performance.now());
    await tratar(r, quadros[quadros.length - 1]);
    ocupado = false;
  }
  $('#tirar').onclick = () => { cap.soltar(); capturar(); };
  addEventListener('keydown', e => {
    if (e.target.matches('input, select, textarea')) return;
    if (e.key === ' ') { e.preventDefault(); $('#tirar').click(); }
    if (e.key === 'a') $('#auto').click();
  });

  $('#arquivo').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const img = $('#foto');
    img.onload = async () => {
      $('#video').hidden = true; img.hidden = false;
      ocupado = true; status('lendo a foto…', 'bom');
      await espera(30);
      const r = Nucleo.medir(img);
      desenhar(r, null);
      await tratar(r, img);
      ocupado = false;
    };
    img.src = URL.createObjectURL(f);
  };

  /* recorte do prato para a camada 2 e para o cardápio */
  function recorte(fonte, r, lado = 640, qualidade = 0.78) {
    const l = fonte.videoWidth || fonte.naturalWidth || fonte.width, a = fonte.videoHeight || fonte.naturalHeight || fonte.height;
    let sx = 0, sy = 0, w = l, h = a;
    if (r && r.contorno) {
      const k = r.contorno, raio = Math.max(k.ea, k.eb) * l * 1.15;
      w = h = Math.min(l, a, Math.round(raio * 2));
      sx = Math.max(0, Math.min(l - w, Math.round(k.cx * l - w / 2)));
      sy = Math.max(0, Math.min(a - h, Math.round(k.cy * a - h / 2)));
    }
    const e = Math.min(1, lado / Math.max(w, h)), c = document.createElement('canvas');
    c.width = Math.round(w * e); c.height = Math.round(h * e);
    c.getContext('2d').drawImage(fonte, sx, sy, w, h, 0, 0, c.width, c.height);
    try { return c.toDataURL('image/jpeg', qualidade); } catch { return null; }
  }

  async function tratar(r, fonte) {
    if (r.falha) return mostrarFalha(r.falha);
    if (ensino) return juntarAmostra(r, fonte);
    let id;
    try {
      id = await api('/api/reconhecer', { method: 'POST', corpo: { grandezas: r.m, versao: r.versao, pesos: r.pesos,
        inflar: r.inflar, mesa: mesa?.numero, foto: recorte(fonte, r) } });
    } catch (e) { return mostrarFalha(`medi, mas o servidor recusou: ${e.message}`); }
    mostrarResultado(r, id);
  }

  function mostrarFalha(texto) {
    $('#saida').innerHTML = `<div class="veredito ruim"><b>não deu para ler</b><br>${esc(texto)}</div>`;
  }

  const ROT = { 0: 'geometria', 1: 'empate', 2: 'modelo de visão', 3: 'fora do cardápio', '-1': 'sem padrão' };
  function mostrarResultado(r, id) {
    const it = id.item_id ? cardapio.find(i => i.id === id.item_id) : null;
    const certeza = id.camada === 0;
    $('#saida').innerHTML = `
      <div class="res-cam ${certeza ? 'certo' : id.camada === 2 ? 'duvida' : 'ruim'}">
        <div class="res-topo">
          <b>${it ? esc(it.nome) : id.camada === 1 ? 'Qual destes?' : 'Não reconheci'}</b>
          ${it ? `<span class="res-preco">${real(it.preco_cent)}</span>` : ''}
        </div>
        <div class="res-meta">camada ${id.camada} · ${ROT[id.camada] || ''} · ${r.forma} ·
          qualidade ${r.qualidade}${r.quadros > 1 ? ` · ${r.quadros} quadros` : ''}${r.visivel < 0.97 ? ` · ${Math.round(r.visivel * 100)}% visível` : ''}</div>
        <p class="res-veredito">${esc(id.veredito)}</p>
        <div class="res-acoes" id="acoes"></div>
        ${r.ressalvas.length ? `<p class="nota">${r.ressalvas.map(esc).join(' · ')}</p>` : ''}
        <details class="res-medidas"><summary>medidas</summary><div class="medidas">${Nucleo.CHAVES.map(k => `
          <div class="medida"><span>${k}</span><span class="calibre"><i style="width:${(r.m[k] * 100).toFixed(1)}%"></i></span>
          <span>${r.m[k].toFixed(3)}</span></div>`).join('')}</div></details>
      </div>`;
    if (!mesa) {
      /* ninguém escolheu a mesa: se só uma mesa espera este prato, ela se
         oferece — um toque em vez de procurar o número na lista */
      const pendentes = it ? esperando(it.id, null) : [];
      const mesas = [...new Set(pendentes.map(p => p.mesa))];
      $('#acoes').innerHTML = mesas.length
        ? mesas.slice(0, 3).map(n => `<button class="btn ${mesas.length === 1 ? 'forte' : ''}" data-mesa-sugerida="${n}">
            mesa ${n} está esperando este prato</button>`).join('')
        : '<span class="nota" style="margin:0">escolha uma mesa acima para lançar</span>';
      $$('#acoes [data-mesa-sugerida]').forEach(b => b.onclick = () => {
        escolherMesa(Number(b.dataset.mesaSugerida)); mostrarResultado(r, id);
      });
      return;
    }
    if (it) {
      const pendentes = esperando(it.id, mesa.numero);
      if (pendentes.length) {
        /* já está na conta: lançar de novo cobraria duas vezes */
        const p = pendentes[0];
        $('#acoes').innerHTML = `<button class="btn forte" id="entregar">marcar entregue na mesa ${mesa.numero}</button>
          <button class="btn" id="lancarMesmo">lançar outro (cobra de novo)</button>`;
        $('#saida').querySelector('.res-veredito').insertAdjacentHTML('afterend',
          `<p class="nota" style="margin:6px 0 0">a mesa ${mesa.numero} já tem <b>${esc(it.nome)}</b> ${esc(p.estado)} — lançar de novo cobraria duas vezes</p>`);
        $('#entregar').onclick = async b => {
          const botao = $('#entregar'); botao.disabled = true;
          try {
            await api(`/api/lancamentos/${p.id}/estado`, { method: 'POST', corpo: { estado: 'entregue' } });
            await carregarFila();
            $('#acoes').innerHTML = `<div class="veredito">entregue na mesa ${mesa.numero}.</div>`;
            if (window.Alerta) Alerta.toast('item-entregue', { mesa: mesa.numero, nome: it.nome });
          } catch (e) { botao.disabled = false; mostrarFalha(e.message); }
        };
        $('#lancarMesmo').onclick = () => contar(it, id);
        return;
      }
    }
    if (certeza && it && autoLancar) return contar(it, id);
    const opcoes = (id.candidatos && id.candidatos.length ? id.candidatos.map(c => c.item_id) : cardapio.filter(i => i.afericao).map(i => i.id))
      .map(i => cardapio.find(x => x.id === i)).filter(Boolean);
    const primeiro = it ? [it, ...opcoes.filter(o => o.id !== it.id)] : opcoes;
    $('#acoes').innerHTML = primeiro.slice(0, 4).map((o, k) => `<button class="btn ${k === 0 && it ? 'forte' : ''}" data-lanca="${o.id}">
      ${esc(o.nome)} → mesa ${mesa.numero}</button>`).join('');
    $$('#acoes [data-lanca]').forEach(b => b.onclick = () => lancar(Number(b.dataset.lanca), id.medicao_id, b));
  }

  /* certeza da geometria: lança sozinho depois de 3 s, a não ser que cancelem */
  function contar(it, id) {
    let s = 3;
    const pintar = () => { $('#acoes').innerHTML = `<div class="contagem"><span>lançando <b>${esc(it.nome)}</b> na mesa ${mesa.numero} em <b>${s}</b></span>
      <button class="btn" id="cancelar">cancelar</button></div>`;
      $('#cancelar').onclick = () => { clearInterval(contagem); contagem = null;
        $('#acoes').innerHTML = `<button class="btn forte" data-lanca="${it.id}">lançar ${esc(it.nome)} → mesa ${mesa.numero}</button>`;
        $('#acoes [data-lanca]').onclick = e => lancar(it.id, id.medicao_id, e.target); }; };
    pintar();
    contagem = setInterval(() => {
      s--;
      if (s > 0) return pintar();
      clearInterval(contagem); contagem = null;
      lancar(it.id, id.medicao_id, null);
    }, 1000);
  }

  async function lancar(itemId, medicaoId, botao) {
    carregarFila();
    if (!mesa) return;
    if (botao) botao.disabled = true;
    try {
      const r = await api(`/api/comandas/${mesa.comanda_id}/itens`, { method: 'POST',
        corpo: { item_id: itemId, qtd: 1, origem: 'camera', medicao_id: medicaoId } });
      const it = cardapio.find(i => i.id === itemId);
      $('#acoes').innerHTML = `<div class="contagem feito"><span>lançado: <b>${esc(it?.nome || '')}</b> na mesa ${mesa.numero}</span>
        <button class="btn" id="desfazer">desfazer</button></div>`;
      if (navigator.vibrate) navigator.vibrate([15, 60, 15]);
      $('#desfazer').onclick = async () => {
        try { await api(`/api/lancamentos/${r.lancamento_id}`, { method: 'DELETE' }); $('#acoes').innerHTML = '<span class="nota" style="margin:0">desfeito</span>'; }
        catch (e) { mostrarFalha(e.message); }
      };
    } catch (e) {
      if (botao) botao.disabled = false;
      mostrarFalha(e.message);
      carregarMesas();
    }
  }

  /* ─────────── ensinar um prato ─────────── */
  function abrirEnsino() {
    $('#ensinar').hidden = false;
    ensino = { amostras: [], foto: null };
    cap.modoEnsinar(true);
    desenharPontos();
    $('#saida').innerHTML = '';
  }
  function fecharEnsino() { $('#ensinar').hidden = true; ensino = null; cap.modoEnsinar(false); }
  $('#ensinarBtn').onclick = () => (ensino ? fecharEnsino() : abrirEnsino());
  $('#fecharEnsinar').onclick = fecharEnsino;
  function desenharPontos() {
    const n = ensino ? ensino.amostras.length : 0;
    $('#pontos').innerHTML = Array.from({ length: 5 }, (_, k) => `<i class="${k < n ? 'cheio' : ''}"></i>`).join('') +
      `<span>${n} de 5</span>`;
    $('#gravarPadrao').disabled = n < 3;
    $('#gravarPadrao').textContent = n < 3 ? `Gravar padrão (mínimo 3)` : `Gravar padrão com ${n} fotos`;
  }
  function juntarAmostra(r, fonte) {
    ensino.amostras.push(r.m);
    if (!ensino.foto) ensino.foto = recorte(fonte, r, 720, 0.84);
    desenharPontos();
    if (ensino.amostras.length >= 5) gravarPadrao();
  }
  async function gravarPadrao() {
    if (!ensino || ensino.amostras.length < 3) return;
    const itemId = Number($('#pratoEnsinar').value);
    const nome = cardapio.find(i => i.id === itemId)?.nome || '';
    try {
      const r = await api('/api/padroes', { method: 'POST', corpo: { item_id: itemId, amostras: ensino.amostras, versao: Nucleo.VERSAO } });
      let foto = '';
      if ($('#fotoCardapio').checked && ensino.foto) {
        try { await api(`/api/cardapio/${itemId}/foto`, { method: 'PUT', corpo: { imagem: ensino.foto } }); foto = ' · a foto foi para o cardápio'; }
        catch (e) { foto = ` · a foto não foi para o cardápio: ${e.message}`; }
      }
      $('#saida').innerHTML = `<div class="veredito"><b>padrão gravado</b><br>${esc(nome)}, com ${r.n} fotos${esc(foto)}</div>` +
        (r.gemeos || []).map(g => `<div class="veredito ${g.nivel === 'indistinguivel' ? 'ruim' : 'duvida'}">
          ${g.nivel === 'indistinguivel' ? 'Pela foto, este prato e' : 'Pode ser confundido com'} <b style="text-transform:none;letter-spacing:0">${esc(g.item)}</b>
          <span class="dm">afastamento ${g.dm} — ${g.nivel === 'indistinguivel' ? 'o sistema vai sempre pedir confirmação' : 'no empate, ele pergunta'}</span></div>`).join('');
      fecharEnsino();
    } catch (e) { mostrarFalha(e.message); }
  }
  $('#gravarPadrao').onclick = gravarPadrao;

  /* ─────────── partida ─────────── */
  marcarAuto();
  api('/api/cardapio').then(c => {
    cardapio = c;
    $('#pratoEnsinar').innerHTML = c.filter(i => i.afericao).map(i => `<option value="${i.id}">${esc(i.nome)}</option>`).join('');
  }).catch(() => {});
  carregarMesas();
  carregarFila();
  setInterval(carregarMesas, 30000);
  setInterval(carregarFila, 20000);
  ligar().then(() => setTimeout(olhar, 400));
  addEventListener('pagehide', () => { if (fluxo) fluxo.getTracks().forEach(t => t.stop()); });
  addEventListener('resize', () => { if (ultimoContorno) desenhar({ contorno: ultimoContorno }, ultimaDecisao); });
})();
</script>
</body>
</html>
