<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bahrem · Salão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/bahrem.css">
</head>
<body>
<main class="portaria">
  <div class="caixa">
    <div class="marca">Bahrem <span>Marista</span></div>
    <p>Controle de salão</p>

    <div class="pin" id="pin" aria-live="polite"></div>
    <div class="erro" id="erro" role="alert"></div>

    <div class="teclado">
      <button class="btn" data-t="1">1</button><button class="btn" data-t="2">2</button><button class="btn" data-t="3">3</button>
      <button class="btn" data-t="4">4</button><button class="btn" data-t="5">5</button><button class="btn" data-t="6">6</button>
      <button class="btn" data-t="7">7</button><button class="btn" data-t="8">8</button><button class="btn" data-t="9">9</button>
      <button class="btn" id="apagar">apagar</button><button class="btn" data-t="0">0</button>
      <button class="btn forte" id="entrar">entrar</button>
    </div>

    <p class="nota" style="margin-top:26px">O cliente não entra por aqui: ele lê o QR da mesa e cai direto na conta dele.</p>
  </div>
</main>

<script src="/app.js"></script>
<script>
(function () {
  const { $, $$, api, guarda } = B;
  let pin = '';
  const mostra = () => $('#pin').textContent = '•'.repeat(pin.length);

  $$('.teclado [data-t]').forEach(b => b.onclick = () => {
    if (pin.length < 8) { pin += b.dataset.t; mostra(); $('#erro').textContent = ''; }
  });
  $('#apagar').onclick = () => { pin = pin.slice(0, -1); mostra(); };

  $('#entrar').onclick = async () => {
    if (pin.length < 4) { $('#erro').textContent = 'o PIN tem pelo menos 4 dígitos'; return; }
    $('#entrar').disabled = true;
    try {
      const r = await api('/api/entrar', { method: 'POST', corpo: { pin } });
      guarda.token = r.token; guarda.eu = { nome: r.nome, papel: r.papel };
      location.href = '/salao';
    } catch (e) {
      $('#erro').textContent = e.message;
      pin = ''; mostra();
    } finally { $('#entrar').disabled = false; }
  };

  addEventListener('keydown', e => {
    if (/^[0-9]$/.test(e.key) && pin.length < 8) { pin += e.key; mostra(); }
    else if (e.key === 'Backspace') { pin = pin.slice(0, -1); mostra(); }
    else if (e.key === 'Enter') $('#entrar').click();
  });
})();
</script>
</body>
</html>
