<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sua conta · Bahrem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/bahrem.css">
</head>
<body>
<main class="conta" id="conta"><p class="vazio">Abrindo sua conta…</p></main>

<script src="/app.js"></script>
<script>
(function () {
  const { $, esc, real, decorrido, api } = B;
  const codigo = (new URLSearchParams(location.search).get('c') || '').toUpperCase();
  let ultimo = null;

  if (!codigo) {
    $('#conta').innerHTML = `<div class="talao"><h1>Conta da mesa</h1>
      <p class="sub">Este link precisa do código da sua mesa. Leia o QR que está na mesa
      ou peça o código ao garçom.</p></div>`;
    return;
  }

  async function carregar() {
    try {
      const c = await api(`/api/conta/${encodeURIComponent(codigo)}`);
      ultimo = c; desenhar(c);
    } catch (e) {
      $('#conta').innerHTML = `<div class="talao"><h1>Conta da mesa</h1>
        <p class="sub">${esc(e.message)}. Chame o garçom — pode ser que a conta já tenha sido fechada.</p></div>`;
    }
  }

  function desenhar(c) {
    const p = c.porPessoa_cent;
    const faixa = p.length > 1 && p[0] !== p[p.length - 1]
      ? `${real(p[p.length - 1])} a ${real(p[0])}` : real(p[0] || 0);

    $('#conta').innerHTML = `
      <div class="talao">
        <h1>${esc(c.casa)}</h1>
        <div class="mesaNum">${c.mesa.numero}</div>
        <div class="sub">${c.mesa.area} · ${c.pessoas} ${c.pessoas > 1 ? 'pessoas' : 'pessoa'} ·
          ${c.status === 'aberta' ? `aberta há ${decorrido(c.aberta_em)}` : 'conta fechada'}</div>

        <div class="comanda">
          ${c.itens.length ? c.itens.map(i => `
            <div class="linha"><span class="q">${i.qtd}×</span>
              <span class="n">${esc(i.nome)}</span>
              <span class="v">${real(i.total_cent)}</span></div>`).join('')
            : '<p class="vazio">Sua comanda ainda está vazia.</p>'}
          <div class="soma"><span>subtotal</span><span>${real(c.subtotal_cent)}</span></div>
          <div class="soma"><span>serviço ${c.servico_pct}% (opcional)</span><span>${real(c.servico_cent)}</span></div>
          <div class="soma total"><span>total</span><b>${real(c.total_cent)}</b></div>
        </div>
        <div class="rateio">dividindo por ${c.pessoas}: <b>${faixa}</b> cada</div>

        ${c.status === 'aberta' ? `<div class="acoes">
          <button class="btn" data-chamar="garcom">Chamar o garçom</button>
          <button class="btn forte" data-chamar="conta">Pedir a conta</button>
        </div>` : ''}

        <p class="nota">Os ${c.servico_pct}% de serviço são opcionais (Lei Municipal 9.418/14).
          A lista acima atualiza sozinha a cada lançamento — confira antes de pagar e,
          se algo não for seu, chame o garçom.</p>
      </div>`;

    $('#conta').querySelectorAll('[data-chamar]').forEach(b => b.onclick = async () => {
      b.disabled = true;
      const antes = b.textContent;
      try {
        await api(`/api/conta/${encodeURIComponent(codigo)}/chamar`, { method: 'POST',
          corpo: { tipo: b.dataset.chamar } });
        b.textContent = b.dataset.chamar === 'conta' ? 'conta pedida' : 'garçom avisado';
      } catch (e) { b.textContent = antes; b.disabled = false; }
    });
  }

  carregar();
  setInterval(carregar, 20000);
  addEventListener('visibilitychange', () => !document.hidden && carregar());
})();
</script>
</body>
</html>
